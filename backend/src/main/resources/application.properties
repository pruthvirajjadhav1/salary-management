spring.application.name=salary-management

# SQLite: one file, foreign keys enforced, WAL so reads don't block the single writer.
app.data-dir=${APP_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${app.data-dir}/salary.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=4

spring.flyway.locations=classpath:db/migration

# Seed 10,000 employees on startup when the database is empty.
app.seed.on-startup=true
app.seed.employee-count=10000
app.seed.random-seed=20261113

management.endpoints.web.exposure.include=health,info
spring.mvc.problemdetails.enabled=true
