# Overrides for tests (Spring Boot layers classpath:/config/ over classpath:/).
# Each Spring context gets its own throwaway SQLite file; Flyway builds the schema exactly as in production.
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/salary-management-test-${random.uuid}.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
app.seed.on-startup=false
